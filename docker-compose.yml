services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: station_maksim
      POSTGRES_USER: station
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U station -d station_maksim"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    environment:
      DATABASE_URL: postgresql://station:${DB_PASSWORD}@postgres:5432/station_maksim
      JWT_SECRET: ${JWT_SECRET}
      ALLOW_DEBUG_PIN: ${ALLOW_DEBUG_PIN:-false}
      PORT: 3001
    ports:
      - "3001:3001"
    volumes:
      - ./server:/app
      - /app/node_modules
    command: sh -c "npx prisma db push && npx prisma db seed && npm run dev"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: .
    ports:
      - "80:80"
    environment:
      VITE_API_URL: http://localhost:3001
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - server

volumes:
  postgres_data:
