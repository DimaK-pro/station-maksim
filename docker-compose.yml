services:
  caddy:
    image: caddy:latest
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/codex-work/projects:/srv/codex-work/projects:ro
      - /srv/codex-work/public/dmitry:/srv/codex-work/public/dmitry:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - server

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: station_maksim
      POSTGRES_USER: station
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U station -d station_maksim"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    environment:
      DATABASE_URL: postgresql://station:${DB_PASSWORD}@postgres:5432/station_maksim
      JWT_SECRET: ${JWT_SECRET}
      ALLOW_DEBUG_PIN: ${ALLOW_DEBUG_PIN:-false}
      PORT: 3001
    ports:
      - "3001:3001"
    volumes:
      - ./server:/app
      - /app/node_modules
    command: sh -c "npx prisma db push && npx prisma db seed && npm run dev"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    depends_on:
      - server

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
